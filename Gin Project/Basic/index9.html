<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>多文件上传</title>
</head>
<body>
<!--
action="/upload" 对应后端POST路由
multiple 开启多选文件
name="file" 必须和后端 form.File["file"] 一致
enctype="multipart/form-data" 文件上传必填
-->
<form action="/upload" method="post" enctype="multipart/form-data">
    <!-- multiple 支持按住Ctrl多选多个文件 -->
    <input type="file" name="file" multiple>
    <br><br>
    <input type="submit" value="批量上传文件">
</form>
</body>
</html>
